# Manual historical fetch. Existing files for past dates are skipped, so
# re-running is cheap. Also rebuilds data/search-index.json, which nothing else
# writes. Use after adding a channel or after an extended outage.

name: Backfill Historical Data

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'How many past days to fetch (default 14)'
        required: false
        default: '14'

env:
  # Pins the runtime for JavaScript-based actions (checkout, setup-node) during
  # GitHub's Node 20 -> 24 transition. Does not affect `node scripts/*.js`.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run backfill
        run: node scripts/backfill.js
        env:
          REGION_ID: 8336         # Foxtel region - selects the schedule variant
          # HD only. The 4K range is fixed at +/-6 days by the DAZN endpoint.
          DAYS_BACK: ${{ github.event.inputs.days_back || '14' }}
          # Proxy is optional and used for the DAZN (4K) calls only.
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || git commit -m "Backfill: last ${{ github.event.inputs.days_back || '14' }} days all channels"
          git push
