# Scheduled collector. Pulls the EPG for every channel, prunes anything past the
# retention window, and commits the result. The frontend reads those committed
# files directly, so this workflow is the only thing keeping the guide current.

name: Fetch Foxtel Schedule

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:

env:
  # Pins the runtime for JavaScript-based actions (checkout, setup-node) during
  # GitHub's Node 20 -> 24 transition. Does not affect `node scripts/*.js`.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      # Small gap so the fetch doesn't start the instant npm finishes
      - name: Wait before fetch
        run: sleep 3

      - name: Fetch all channels (today + 2 days)
        run: node scripts/fetch.js
        env:
          REGION_ID: 8336         # Foxtel region - selects the schedule variant
          # Proxy is optional and used for the DAZN (4K) calls only. Unset means
          # a direct connection, which the geo-restricted endpoint may refuse.
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}

      - name: Cleanup old files
        run: node scripts/cleanup.js

      # Skips the commit when nothing changed, so quiet periods don't produce
      # empty commits.
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes" || git commit -m "Schedule update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
